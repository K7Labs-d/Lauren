<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مهمة لورين السرية</title>
<style>
:root{--a:#8b5cf6;--b:#ec4899;--ink:#2e2440}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);
background:radial-gradient(circle at 20% 10%,#ffd8ef,transparent 30%),
radial-gradient(circle at 90% 20%,#ddd3ff,transparent 28%),
linear-gradient(145deg,#fff7fc,#f3efff)}
.card{width:min(560px,100%);background:#ffffffec;border:1px solid #fff;border-radius:30px;
padding:32px 22px;box-shadow:0 25px 70px #5b21b622;text-align:center}
.cat{font-size:82px;margin-bottom:6px}
h1{font-size:clamp(28px,7vw,40px);margin:0 0 8px}
p{font-size:17px;line-height:1.7;color:#6d6380}
.status{margin:20px 0;background:#f6f2ff;border-radius:18px;padding:16px;font-weight:800;min-height:62px;display:grid;place-items:center}
button{width:100%;border:0;border-radius:18px;padding:16px 18px;margin-top:10px;font-size:18px;font-weight:900;cursor:pointer}
.primary{color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 24px #8b5cf633}
.secondary{background:#ede9fe;color:#4c1d95}
.hidden{display:none}
.small{font-size:13px;margin-top:14px;color:#887e99}
</style>
</head>
<body>
<div class="card">
  <div class="cat" id="cat">🐱</div>
  <h1>رسالة سرية إلى لورين</h1>
  <p>ارفعي الصوت شوي... ولا تقولين لأحد عن المهمة.</p>
  <div class="status" id="status">جاهزة للمكالمة السرية؟</div>
  <button class="primary" id="start">ابدئي</button>
  <button class="secondary hidden" id="iam">أنا لورين</button>
  <button class="secondary hidden" id="meow">مياااو</button>
  <button class="secondary hidden" id="again">مرة ثانية</button>
  <div class="small">الصوت هنا ملفات MP3 طبيعية، وليس صوت المتصفح.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const clips={intro:"audio/01_intro.mp3",name:"audio/02_name.mp3",confirm:"audio/03_confirm.mp3",
dad:"audio/04_dad.mp3",secret:"audio/05_secret.mp3",cats:"audio/06_cats.mp3",
result:"audio/07_result.mp3",final:"audio/08_final.mp3"};
let current=null;
function play(src){return new Promise((res,rej)=>{if(current){current.pause();current=null}
const a=new Audio(src);current=a;a.onended=()=>{current=null;res()};a.onerror=()=>{current=null;rej(new Error("audio"))};a.play().catch(rej)})}
function st(t){$("status").textContent=t}
async function intro(){
 $("start").classList.add("hidden"); $("again").classList.add("hidden"); $("iam").classList.add("hidden"); $("meow").classList.add("hidden");
 $("cat").textContent="🐱"; st("جاري الاتصال بمملكة القطط...");
 try{await play(clips.intro); await play(clips.name); st("هل أنتِ لورين؟"); $("iam").classList.remove("hidden")}
 catch(e){st("الصوت غير موجود بعد. شغّل generate_audio.py أولًا."); $("start").classList.remove("hidden")}
}
$("start").onclick=intro;
$("iam").onclick=async()=>{
 $("iam").classList.add("hidden"); $("cat").textContent="😼"; st("تم التأكد من الهوية");
 await play(clips.confirm); await play(clips.dad); await play(clips.secret); await play(clips.cats);
 st("اختبار مملكة القطط"); $("meow").classList.remove("hidden")
};
$("meow").onclick=async()=>{
 $("meow").classList.add("hidden"); $("cat").textContent="😹"; st("جاري تحليل المياو...");
 await play(clips.result); await play(clips.final);
 $("cat").textContent="😻"; st("المهمة اكتملت بنجاح"); $("again").classList.remove("hidden")
};
$("again").onclick=intro;
</script>
</body>
</html>
